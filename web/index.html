<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f6">
<meta name="description" content="沿着走廊发现音乐，用网易云音乐扫码连接你的歌单。">
<title>Breeze</title>
<link rel="stylesheet" href="/gallery.css">
<script type="module" src="/gallery.js"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="icon-note" viewBox="0 0 24 24"><path d="M9 17V5l12-2v12M9 9l12-2M9 17c0 1.2-1.35 2.2-3 2.2S3 18.5 3 17.3s1.35-2.2 3-2.2 3 .7 3 1.9ZM21 15c0 1.2-1.35 2.2-3 2.2s-3-.7-3-1.9 1.35-2.2 3-2.2 3 .7 3 1.9Z"/></symbol>
  <symbol id="icon-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="icon-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><path stroke-width="3" d="M9 6v12m6-12v12"/></symbol>
</svg>
<header class="header" id="header">
  <div class="brand"><span class="brand-icon"><svg><use href="#icon-note"/></svg></span>Breeze</div>
  <nav aria-label="音乐导航">
    <button class="pill" id="library-button" type="button">我的歌单</button>
    <button class="pill accent" id="account-button" type="button">网易云登录</button>
  </nav>
</header>
<main class="gallery" id="gallery">
  <div class="stage" id="stage" tabindex="0" aria-label="滑动走廊，点封面选歌，轻点空白处切换全屏">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="wall-layer" id="wall-layer"></div>
    <div class="corridor-lyrics" id="corridor-lyrics" aria-label="全屏歌词" hidden></div>
    <div class="wall-lyrics" id="wall-lyrics" aria-label="歌曲歌词" hidden></div>
    <div class="walking-lyrics" id="walking-lyrics" aria-label="当前歌词" aria-hidden="true" hidden></div>
    <div class="stage-fallback" id="stage-fallback" hidden>
      <button id="fallback-work" type="button" aria-label="播放当前歌曲"><img id="fallback-image" alt=""></button>
    </div>
  </div>
  <p class="stage-note" id="stage-note" role="status">登录网易云音乐后，歌单会出现在墙上</p>
  <section class="dock" id="player" aria-label="音乐播放器" hidden>
    <div class="dock-top">
      <img id="player-art" alt="">
      <div class="dock-track"><strong id="player-title"></strong><span id="player-artist"></span></div>
      <button class="circle small" id="song-prev" type="button" aria-label="上一曲"><svg><use href="#icon-left"/></svg></button>
      <button class="circle play-button" id="play-toggle" type="button" aria-label="播放"><svg><use href="#icon-play"/></svg></button>
      <button class="circle small" id="song-next" type="button" aria-label="下一曲"><svg><use href="#icon-right"/></svg></button>
      <button class="circle small close" id="player-close" type="button" aria-label="关闭播放器"><svg><use href="#icon-close"/></svg></button>
    </div>
    <div class="timeline">
      <output id="elapsed">0:00</output>
      <input type="range" id="seek" min="0" max="1" value="0" step="any" aria-label="播放进度" disabled>
      <output id="duration">0:00</output>
    </div>
    <div class="dock-meta" id="dock-meta" hidden>
      <p id="play-status" role="status"></p><a id="official-link" target="_blank" rel="noopener noreferrer" hidden>在网易云打开</a>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>
</main>
<dialog class="sheet" id="library" aria-labelledby="library-title">
  <div class="sheet-head">
    <h2 id="library-title">曲库</h2>
    <button class="circle close" type="button" data-close="library" aria-label="关闭曲库"><svg><use href="#icon-close"/></svg></button>
  </div>
  <div class="tabs" aria-label="曲库来源">
    <button type="button" data-library="wall" aria-pressed="false">墙上歌曲</button>
    <button type="button" data-library="personal" aria-pressed="true">我的歌单</button>
  </div>
  <div class="sheet-body" id="library-body"></div>
</dialog>
<dialog class="sheet account" id="account" aria-labelledby="account-title">
  <div class="sheet-head">
    <h2 id="account-title">网易云音乐登录</h2>
    <button class="circle close" type="button" data-close="account" aria-label="关闭登录"><svg><use href="#icon-close"/></svg></button>
  </div>
  <div class="sheet-body">
    <div id="sign-in">
      <p class="scan-tip">用网易云音乐 App 的「扫一扫」扫码并确认登录。</p>
      <div class="qr-box" id="qr-box" hidden><img id="qr-image" alt="网易云音乐登录二维码"></div>
      <p id="login-status" class="status" role="status"></p>
      <div class="account-actions">
        <a class="pill" id="qr-link" target="_blank" rel="noopener noreferrer" hidden>在本机打开网易云</a>
        <button class="pill" id="qr-refresh" type="button">生成二维码</button>
      </div>
    </div>
    <div id="signed-in" hidden>
      <p class="profile" id="nickname"></p>
      <div class="account-actions">
        <button class="pill accent" id="my-playlists" type="button">查看我的歌单</button>
        <button class="pill" id="logout" type="button">退出登录</button>
      </div>
      <p class="status" id="account-status" role="status"></p>
    </div>
  </div>
</dialog>
</body>
</html>
